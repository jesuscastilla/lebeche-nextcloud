services:
  nextcloud:
    # Pineada a 35.0.3 (2026-11-19): evitar pulls silenciosos de la rama 35.0.
    image: nextcloud:35.0.3-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8087:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Madrid
      MYSQL_HOST: host.docker.internal:3307
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: lebeche
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "nube.corrientelebeche.es 192.168.50.94 192.168.50.93 localhost"
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nube.corrientelebeche.es
      TRUSTED_PROXIES: "127.0.0.1 172.16.0.0/12 192.168.50.0/24"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      NEXTCLOUD_INIT_HTACCESS: "true"
    volumes:
      - ./html:/var/www/html
      - /volume1/nextcloud:/var/www/html/data
      - ./apache-mpm.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      # JIT off (SIGSEGV de mod_php con PHP 8.5 en aarch64). NO quitar este montaje.
      - ./php-nas.ini:/usr/local/etc/php/conf.d/zz-nas.ini:ro
    mem_limit: 900m
    # Si mod_php vuelve a colgarse (AH00051), Docker reinicia el contenedor.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/status.php"]
      interval: 2m
      timeout: 20s
      retries: 3
      start_period: 5m

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m

