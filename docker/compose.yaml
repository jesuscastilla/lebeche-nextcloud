services:
  nextcloud:
    image: nextcloud:35.0-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8087:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Madrid
      MYSQL_HOST: host.docker.internal:3307
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: lebeche
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "nube.corrientelebeche.es 192.168.50.94 192.168.50.93 localhost"
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nube.corrientelebeche.es
      TRUSTED_PROXIES: "127.0.0.1 172.16.0.0/12 192.168.50.0/24"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      NEXTCLOUD_INIT_HTACCESS: "true"
    volumes:
      - ./html:/var/www/html
      - /volume1/nextcloud:/var/www/html/data
      - ./apache-mpm.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
      - ./php-nas.ini:/usr/local/etc/php/conf.d/zz-nas.ini:ro
    mem_limit: 900m

